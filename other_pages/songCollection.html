<!DOCTYPE html>
<html>
<head>
    <title>Song Collection</title>
    <link rel="stylesheet" href="songCollection.css">
    <link rel="stylesheet" href="../utilities/css/all.min.css">
    </head>
<body>
    <h1>Song Collection & Editor</h1>

    <div class="selector-group">
        <label for="song-select">Select a Song:</label>
        <select id="song-select">
            <option value="">--- Select Song ---</option>
        </select>
    </div>

    <div id="loading-message">Loading Songs...</div>

    <div id="song-details-container">
        <h2>Song edit</h2>
        <form id="song-details-form">
            <!-- Hidden ID field to know which record to update -->
            <input type="hidden" id="id" name="id">

            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required>

            <label for="author">Author/Artist:</label>
            <input type="text" id="author" name="author">

            <div class="label-info-wrapper">
                <label for="lyrics">Lyrics:</label>
                <i class="fa-solid fa-circle-info info-icon" id="lyrics-info"></i>
            </div>
            <textarea id="lyrics" name="lyrics" required></textarea>

            <div class="label-info-wrapper">
                <label for="originalOrder">Verse Order (e.g. V1, C1, V2, C1):</label>
                <i class="fa-solid fa-circle-info info-icon" id="order-info"></i>
             </div>
            <input type="text" id="originalOrder" name="originalOrder">

            <label for="theme">Theme:</label>
            <select id="theme" name="theme">
                
            </select>
            
            <div class="action-buttons">
                <button type="submit" id="save-button">Safe (Edit)</button>
                <button type="button" id="delete-button">Delete</button>
            </div>
        </form>
    </div>
    <script src="./songCollection.js"></script>
</body>
</html>
