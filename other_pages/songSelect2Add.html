<!DOCTYPE html>
<html>
<head>
    <title>Song auswählen</title>
    <style>
        body { 
        font-family: sans-serif; 
        padding: 30px; /* Etwas weniger Padding für mehr Platz */
        background-color: #f4f4f9; 
        display: flex; 
        flex-direction: column; 
        height: 100vh; 
        margin: 0; 
        box-sizing: border-box; /* Padding wird in die 100vh eingerechnet */
    }
    h2 { color: #007bff; margin-top: 0; flex-shrink: 0; }
    
    .content { 
        flex-grow: 1; 
        display: flex; 
        flex-direction: column; 
        min-height: 0; 
    }
    
    .selector-group { 
        margin-bottom: 20px; 
        display: flex; 
        flex-direction: column; 
        flex-grow: 1; 
        min-height: 0; 
    }
    
    .selector-group label { font-weight: bold; display: block; margin-bottom: 5px; flex-shrink: 0; }
    
    #song-search {
        width: 100%; 
        padding: 10px; 
        margin-bottom: 10px; 
        border-radius: 4px; 
        border: 1px solid #ccc; 
        box-sizing: border-box;
        flex-shrink: 0;
    }

    #song-select {
        padding: 10px;
        width: 100%;
        border-radius: 4px;
        border: 1px solid #ccc;
        flex-grow: 1;
        overflow-y: auto;
        outline: none;
    }

    #song-select option { padding: 8px; border-bottom: 1px solid #eee; }
    #song-select option:checked { background-color: #007bff; color: white; }

    #loading-message { margin-top: 10px; color: #666; font-style: italic; flex-shrink: 0; }
    
    .action-buttons {
        display: flex; 
        justify-content: flex-end; 
        gap: 10px; 
        padding-top: 10px;
        flex-shrink: 0; /* Buttons dürfen niemals kleiner werden */
        border-top: 1px solid #ddd; /* Optionale Trennlinie */
    }
    
    .action-buttons button {
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        color: white;
        font-weight: bold;
    }
    #add-button { background-color: #28a745; }
    #cancel-button { background-color: #6c757d; }
    </style>
</head>
<body>
    <h2>Song zum Ablaufplan hinzufügen</h2>
    <div class="content">
        <div class="selector-group">
            <label for="song-search">Song suchen:</label>
            <input type="text" id="song-search" placeholder="Titel oder Autor eingeben..." 
           style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;">
            <label for="song-select">Verfügbare Songs:</label>
            <select id="song-select" multiple>
            </select>
        </div>
        <div id="loading-message">Lade Songs...</div>
    </div>

    <div class="action-buttons">
        <button id="cancel-button">Abbrechen</button>
        <button id="add-button" disabled>Hinzufügen</button>
    </div>

    <script src="./songSelect2Add.js"></script>
</body>
</html>
