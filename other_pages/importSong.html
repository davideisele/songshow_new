<!DOCTYPE html>
<html>
<head>
    <title>Import Song manually</title>
    <link rel="stylesheet" href="importSong.css">
    <link rel="stylesheet" href="../utilities/css/all.min.css">
    </head>
<body>
    <form id="import-song-form">
        <label for="title">Title:</label>
        <input type="text" id="title" required><br><br>

        <label for="author">Author/Artist:</label>
        <input type="text" id="author"><br><br>

        <div class="label-info-wrapper"></div>
            <label for="lyrics">Lyrics:</label>
            <i class="fa-solid fa-circle-info info-icon" id="lyrics-info"></i>
        </div>
        <textarea id="lyrics" required></textarea><br><br>

        <div class="label-info-wrapper"></div>
        <label for="originalOrder">Verse Order (e.g. V1,C1,V2,C1):</label>
        <i class="fa-solid fa-circle-info info-icon" id="order-info"></i>
        </div>
        <input type="text" id="originalOrder"><br><br>

        <!-- TODO: Theme => DropdownList -->
        <label for="theme">Theme:</label>
        <div id="theme-selector">
            <select id="theme">
        </select>
        <br><br>
        </div>

        <div class="import-buttons">
            <button type="submit">Save</button>
            <button type="button" id="cancel-button">Cancel</button>
    </div>
        
    </form>

    <script src="importSong.js"></script>
</body>
</html>
